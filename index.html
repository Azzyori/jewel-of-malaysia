<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Jewel of Malaysia</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;color:#1c2b2b;background:#fff;line-height:1.6}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid #e3ebea;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;justify-content:space-between;padding:12px 24px;z-index:9}
.logo{font-weight:700;color:#0f766e;text-decoration:none}nav a{margin-right:16px;color:#1c2b2b;text-decoration:none}nav a:hover,.pn a:hover{color:#0f766e}
main{max-width:1000px;margin:0 auto;padding:24px}h1{font-size:2.2rem;margin:.3em 0}h2{margin-top:2em;border-bottom:2px solid #0f766e;padding-bottom:4px}
.lead{font-size:1.15rem;color:#456}.chip{display:inline-block;background:#e6f4f1;color:#0f766e;padding:2px 12px;border-radius:99px;font-size:.85rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.card,.box{border:1px solid #e3ebea;border-radius:10px;padding:14px;text-decoration:none;color:inherit;display:block}
a.card:hover{border-color:#0f766e;box-shadow:0 2px 10px #0f766e22}.card h3,.box h3{margin:.4em 0 .2em}.card p,.box p{margin:0}
.ph{aspect-ratio:16/10;background:linear-gradient(135deg,#cfe8e4,#eef6f4);border-radius:8px;overflow:hidden}.ph img{width:100%;height:100%;object-fit:cover;display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.credit,small{color:#678;font-size:.8rem}.pn{display:flex;justify-content:space-between;margin-top:2em}.pn a{color:#1c2b2b}
.bar{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}input,select{padding:8px 12px;border:1px solid #bcd;border-radius:8px;font-size:1rem}input{flex:1;min-width:200px}
#map{height:520px;border-radius:10px}footer{border-top:1px solid #e3ebea;padding:20px 24px;text-align:center;font-size:.85rem;color:#678}footer a{margin:0 6px;color:#0f766e;text-decoration:none}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #e3ebea;padding:8px;text-align:left;vertical-align:top}th{color:#0f766e}
@media(max-width:640px){.two{grid-template-columns:1fr}h1{font-size:1.7rem}}</style></head><body><header><a class="logo" href="#/">The Jewel of Malaysia</a><nav><a href="#/">Home</a><a href="#/map">Map</a><a href="#/gallery">Gallery</a><a href="#/culture">Culture &amp; Cuisine</a><a href="#/about">About</a></nav></header><main id="app"></main><footer id="foot"></footer><script>const DATA=[{"slug": "johor", "name": "Johor", "region": "Southern", "lat": 1.49, "lng": 103.74, "tag": "Gateway to the south", "attr": [["Legoland Malaysia Resort", "Theme park in Iskandar Puteri"], ["Desaru Coast", "Beach resort area on the south-east coast"], ["Endau-Rompin National Park", "Lowland rainforest shared with Pahang"]], "food": "Laksa Johor, otak-otak", "culture": "Kuda kepang dance", "best": "March to October is generally drier"}, {"slug": "kedah", "name": "Kedah", "region": "Northern", "lat": 6.35, "lng": 99.8, "tag": "Rice bowl of Malaysia and home of Langkawi", "attr": [["Langkawi", "Island group with beaches and the Sky Bridge"], ["Gunung Jerai", "Mountain with views over the northern plains"], ["Bujang Valley", "Archaeological site of ancient temples"]], "food": "Laksa Kedah, pulut udang", "culture": "Bujang Valley heritage", "best": "Langkawi is best from November to April"}, {"slug": "kelantan", "name": "Kelantan", "region": "East Coast", "lat": 6.13, "lng": 102.24, "tag": "Cradle of Malay culture", "attr": [["Pasar Siti Khadijah", "Famous market in Kota Bharu"], ["Wat Phothivihan", "Large reclining Buddha in Tumpat"], ["Gunung Stong State Park", "Waterfalls and highland forest"]], "food": "Nasi kerabu, akok", "culture": "Wayang kulit and gasing", "best": "March to October; the northeast monsoon brings heavy rain from November"}, {"slug": "melaka", "name": "Melaka", "region": "Southern", "lat": 2.19, "lng": 102.25, "tag": "UNESCO World Heritage city", "attr": [["A Famosa", "Remains of the Portuguese fortress"], ["Stadthuys", "Dutch colonial red buildings"], ["Jonker Street", "Heritage street with a weekend night market"]], "food": "Chicken rice balls, asam pedas", "culture": "Baba Nyonya (Peranakan) culture", "best": "Year-round; weekdays are quieter"}, {"slug": "negeri-sembilan", "name": "Negeri Sembilan", "region": "Southern", "lat": 2.73, "lng": 101.94, "tag": "Land of Minangkabau heritage", "attr": [["Istana Lama Seri Menanti", "Wooden Minangkabau-style royal palace"], ["Port Dickson", "Seaside town with popular beaches"], ["Seremban", "State capital close to Kuala Lumpur"]], "food": "Masak lemak cili api, lemang", "culture": "Adat Perpatih and Minangkabau customs", "best": "Year-round"}, {"slug": "pahang", "name": "Pahang", "region": "East Coast", "lat": 4.47, "lng": 101.38, "tag": "Highlands, rainforest and islands", "attr": [["Cameron Highlands", "Tea plantations and a cool climate"], ["Taman Negara", "Ancient tropical rainforest"], ["Tioman Island", "Island with beaches and diving"]], "food": "Patin masak tempoyak", "culture": "Malay royal heritage in Pekan", "best": "Highlands year-round; islands March to October"}, {"slug": "perak", "name": "Perak", "region": "Northern", "lat": 4.6, "lng": 101.09, "tag": "Heritage and limestone landscapes", "attr": [["Ipoh Old Town", "Colonial buildings and street murals"], ["Kellie's Castle", "Unfinished mansion in Batu Gajah"], ["Belum-Temengor", "Large rainforest reserve in the north"]], "food": "Ipoh white coffee, nga choy kai", "culture": "Tin-mining heritage", "best": "Year-round"}, {"slug": "perlis", "name": "Perlis", "region": "Northern", "lat": 6.44, "lng": 100.2, "tag": "Malaysia's smallest state", "attr": [["Gua Kelam", "Cave with a walkway through a limestone hill"], ["Wang Kelian State Park", "Forest and limestone landscape"], ["Harumanis orchards", "Home of the fragrant Harumanis mango"]], "food": "Harumanis mango", "culture": "Malay-Thai border influences", "best": "Harumanis season is around April to May"}, {"slug": "penang", "name": "Penang", "region": "Northern", "lat": 5.41, "lng": 100.33, "tag": "Pearl of the Orient and food capital", "attr": [["George Town", "UNESCO World Heritage city with street art"], ["Penang Hill", "Hill station reached by funicular"], ["Kek Lok Si Temple", "Large Buddhist temple in Air Itam"]], "food": "Char kway teow, assam laksa", "culture": "George Town Festival", "best": "December to February is drier"}, {"slug": "sabah", "name": "Sabah", "region": "East Malaysia", "lat": 6.08, "lng": 116.56, "tag": "Land Below the Wind", "attr": [["Mount Kinabalu", "Highest peak in Malaysia at 4,095 m"], ["Sipadan Island", "World-renowned diving site"], ["Kinabatangan River", "Wildlife cruises along the river"]], "food": "Hinava, Tuaran mee", "culture": "Kaamatan harvest festival and Sumazau dance", "best": "March to October is generally drier; book Kinabalu climbs early"}, {"slug": "sarawak", "name": "Sarawak", "region": "East Malaysia", "lat": 1.55, "lng": 110.36, "tag": "Land of the Hornbills", "attr": [["Gunung Mulu National Park", "UNESCO site with giant caves"], ["Bako National Park", "Proboscis monkeys and coastal trails"], ["Kuching Waterfront", "Riverside promenade in the state capital"]], "food": "Sarawak laksa, kolo mee", "culture": "Gawai Dayak and the Rainforest World Music Festival", "best": "March to October is generally drier"}, {"slug": "selangor", "name": "Selangor", "region": "Central", "lat": 3.24, "lng": 101.68, "tag": "Modern state with religious and natural icons", "attr": [["Batu Caves", "Limestone caves with a Hindu temple"], ["Sultan Salahuddin Abdul Aziz Shah Mosque", "Blue-domed mosque in Shah Alam"], ["Kuala Selangor", "Firefly watching along the river"]], "food": "Bak kut teh, satay Kajang", "culture": "Thaipusam at Batu Caves", "best": "Year-round"}, {"slug": "terengganu", "name": "Terengganu", "region": "East Coast", "lat": 5.78, "lng": 103.01, "tag": "Islands and Malay craft", "attr": [["Redang Island", "Marine park with clear water"], ["Masjid Kristal", "Crystal Mosque in Kuala Terengganu"], ["Tasik Kenyir", "Large man-made lake with islands"]], "food": "Keropok lekor, nasi dagang", "culture": "Songket and batik weaving", "best": "March to October; islands are mostly closed during the northeast monsoon"}, {"slug": "federal-territories", "name": "Federal Territories", "region": "Federal Territories", "lat": 3.16, "lng": 101.71, "tag": "Kuala Lumpur, Putrajaya and Labuan", "attr": [["Petronas Twin Towers", "Iconic skyscrapers in Kuala Lumpur"], ["Putra Mosque", "Pink-domed mosque by Putrajaya Lake"], ["Labuan Marine Park", "Island group with dive sites and wrecks"]], "food": "Nasi lemak, street food from all communities", "culture": "Multicultural festivals", "best": "Year-round"}];
const q=s=>document.querySelector(s),A=q('#app');
const ph=d=>`<div class="ph"><img src="images/${d.slug}.jpg" alt="${d.name}" onerror="this.remove()"></div>`;
const card=d=>`<a class="card" href="#/${d.slug}">${ph(d)}<h3>${d.name}</h3><p>${d.tag}</p><small>${d.region}</small></a>`;
const fig=d=>`<a class="card" href="#/${d.slug}">${ph(d)}<small>${d.name}: ${d.attr[0][0]}</small></a>`;
const regs=[...new Set(DATA.map(d=>d.region))].sort();
const opts='<option value="">All regions</option>'+regs.map(r=>`<option>${r}</option>`).join('');
function list(f,withSearch){const g=q('#grid'),s=q('#search'),r=q('#region');
const draw=()=>{const t=(s?s.value:'').toLowerCase(),x=r.value;g.innerHTML=DATA.filter(d=>(!x||d.region==x)&&(d.name+' '+d.attr.map(a=>a[0]).join(' ')+' '+d.food).toLowerCase().includes(t)).map(f).join('')||'<p>No results found.</p>'};
if(s)s.oninput=draw;r.onchange=draw;draw()}
const V={
home(){A.innerHTML=`<h1>The Jewel of Malaysia</h1><p class="lead">Explore the tourist attractions of every Malaysian state, from Perlis to Sabah.</p><div class="bar"><input id="search" placeholder="Search a state, attraction or food"><select id="region">${opts}</select></div><div class="grid" id="grid"></div>`;list(card)},
gallery(){A.innerHTML=`<h1>Photo Gallery</h1><p class="lead">One highlight from every state. Select a photo to open its page.</p><div class="bar"><select id="region">${opts}</select></div><div class="grid" id="grid"></div>`;list(fig)},
map(){A.innerHTML='<h1>Interactive Map</h1><p class="lead">Select a marker to see the state and open its page. The map needs an internet connection.</p><div id="map"></div>';
const go=()=>{const m=L.map('map').setView([4.2,109],6);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap contributors',maxZoom:18}).addTo(m);DATA.forEach(d=>L.marker([d.lat,d.lng]).addTo(m).bindPopup(`<b>${d.name}</b><br>${d.tag}<br><a href="#/${d.slug}">Open page</a>`))};
if(window.L)return go();const c=document.createElement('link');c.rel='stylesheet';c.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css';document.head.append(c);
const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js';s.onload=go;document.head.append(s)},
culture(){A.innerHTML=`<h1>Culture &amp; Cuisine</h1><p class="lead">Local food and traditions to experience in each state.</p><table><tr><th>State</th><th>Must-try food</th><th>Culture</th></tr>${DATA.map(d=>`<tr><td><a href="#/${d.slug}">${d.name}</a></td><td>${d.food}</td><td>${d.culture}</td></tr>`).join('')}</table>`},
about(){A.innerHTML='<h1>About This Website</h1><p>The Jewel of Malaysia introduces tourist attractions across all 13 states and the Federal Territories. Each state has its own page with top attractions, food, culture and the best time to visit.</p><h2>Group</h2><p>[Group name]</p><p>[Member names]</p><h2>Sources</h2><p>Tourism Malaysia. <a href="https://www.malaysia.travel">https://www.malaysia.travel</a></p><p>UNESCO World Heritage Centre. <a href="https://whc.unesco.org">https://whc.unesco.org</a></p><p>Map data &copy; OpenStreetMap contributors.</p>'},
state(i){const d=DATA[i],p=DATA[(i+DATA.length-1)%DATA.length],n=DATA[(i+1)%DATA.length];
A.innerHTML=`${ph(d)}<p class="credit">Photo: [add photographer or source]</p><h1>${d.name}</h1><p class="lead">${d.tag}</p><span class="chip">${d.region}</span><h2>Top attractions</h2><div class="grid">${d.attr.map(a=>`<div class="box"><h3>${a[0]}</h3><p>${a[1]}</p></div>`).join('')}</div><h2>Culture and cuisine</h2><div class="two"><div class="box"><h3>Must-try food</h3><p>${d.food}</p></div><div class="box"><h3>Culture</h3><p>${d.culture}</p></div></div><h2>Best time to visit</h2><p>${d.best}.</p><div class="pn"><a href="#/${p.slug}">&larr; ${p.name}</a><a href="#/">Home</a><a href="#/${n.slug}">${n.name} &rarr;</a></div>`}};
q('#foot').innerHTML=DATA.map(d=>`<a href="#/${d.slug}">${d.name}</a>`).join('')+'<p>The Jewel of Malaysia | UT0012 Group Assignment | Universiti Malaysia Sabah</p>';
function route(){const h=location.hash.replace(/^#\/?/,'')||'home',i=DATA.findIndex(d=>d.slug==h);
if(i>=0){V.state(i);document.title=DATA[i].name+' | The Jewel of Malaysia'}else{(V[h]||V.home)();document.title=(h=='culture'?'Culture and Cuisine':h.charAt(0).toUpperCase()+h.slice(1))+' | The Jewel of Malaysia'}window.scrollTo(0,0)}
addEventListener('hashchange',route);route();
</script></body></html>
